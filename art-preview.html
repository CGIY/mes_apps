<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aperçu des créatures</title>
<style>body{margin:0;padding:20px;background:#122536;color:#e9dfc9;font:14px system-ui}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:560px;margin:auto}.card{min-width:0;text-align:center;border:1px solid #8a9e9b66;border-radius:12px;background:radial-gradient(circle at 50% 25%,#405367,#1a2e3d 70%);padding:6px}.card svg{display:block;width:100%;aspect-ratio:1;overflow:hidden}.card b{display:block;margin:2px 0 7px;font:12px Georgia}</style>
<main class="gallery" id="gallery"></main><script src="creature-art.js?v=6"></script><script>
  const ids=['goblin','skeleton','mimic','kobold','zombie','myconid','mephit','ooze','owlbear','beholder','illithid','lich','minotaur','troll','stonegiant','bulette','dragon','hag','shadow','banshee','vargouille','scarecrow','bunny','foxling','hedgehog','mothling','inkwatcher','twomask','blindscribe','hingewraith','jawdoor','livingarchive','coralcrab','glowdrowned','armoredeel','rustpuppet','blindprompter','threadspider','jailer','briarqueen','cerberus','auric','stag','castellan','oracle','archivist','lightkeeper','puppetmaster'];
  gallery.innerHTML=ids.map(id=>`<div class="card">${DonjonArt.monster(id,id)}<b>${id}</b></div>`).join('');
</script></html>
