  function entryGiftMarkup(){return (state.finalChallenge.entryDrops||[]).map(({index,item})=>`<section class="entry-gift ${item.kind==='pink'?'rose-gift':''}"><span class="micro">${escape(state.players[index].name)} · découverte</span>${item.kind==='pink'?`<span class="gift-chest">${pinkChestSprite()}</span>`:''}${dropMarkup(item)}</section>`).join('')}
  function finalRoster(losses=[]){return `<div class="final-roster">${state.players.map((p,i)=>`<article class="final-fighter ${p.hp?'':'is-ko'}"><b>${escape(p.name)}</b><div class="health" aria-label="${p.hp} cœurs">${Array.from({length:p.max},(_,j)=>heart(j<p.hp,losses.some(loss=>loss.index===i&&j>=p.hp&&j<p.hp+loss.damage)?'just-lost':'')).join('')}</div><span class="duo-weapon">${weaponIcon(p.weapon)}<span>${escape(weapons.find(w=>w.id===p.weapon).name)}</span></span></article>`).join('')}</div>`}
  function finalDice(rolls,rolling=false){return `<div class="duo-dice">${(rolls||livingPlayers().map(({index})=>({index}))).map(d=>`<div><b>${escape(state.players[d.index].name)}</b>${battleDie(d.raw||0,rolling)}${rolling?'':rollReadout(d)}</div>`).join('')}</div>`}
  function takeFinalDamage(){
    const targets=livingPlayers(),amount=state.finalChallenge.damage/Math.max(1,targets.length);
    // Everyone takes the same attack before cross-player resurrection is resolved.
    const losses=targets.map(({p,index})=>({index,damage:takeDamage(amount,p,true)}));resolveAutoPotions();return losses;
  }

  function finePixels(cells){
    cells=[...new Map(cells.map(cell=>[`${cell.x},${cell.y}`,cell])).values()];
    const occupied=new Set(cells.map(c=>`${c.x},${c.y}`)),paths=new Map();
    const add=(color,x,y,w=1,h=1)=>paths.set(color,(paths.get(color)||'')+`M${x} ${y}h${w}v${h}h${-w}z`);
    const tint=(hex,k)=>'#'+[1,3,5].map(i=>Math.max(0,Math.min(255,parseInt(hex.slice(i,i+2),16)+k)).toString(16).padStart(2,'0')).join('');
    cells.forEach(({x,y})=>add('#0b1c22',x*2+1,y*2+1,2,2));
    cells.forEach(({x,y,color})=>{add(color,x*2,y*2,2,2);if(!occupied.has(`${x},${y-1}`))add(tint(color,25),x*2,y*2,2,1);if(!occupied.has(`${x+1},${y}`))add(tint(color,-23),x*2+1,y*2+1);if((x*7+y*13)%11===0)add(tint(color,12),x*2,y*2+1)});
    return [...paths].map(([fill,d])=>`<path fill="${fill}" d="${d}"/>`).join('');
  }

  function renderAllocation(rolling=false){

  function beginNextAllocation(){if(!state.allocationRunning||state.allocationIndex>=state.pendingAwards.length)return;state.lastAllocation=null;state.coinOutcome=random(2)?'Pile':'Face';state.phase='allocation-rolling';render()}

  function ongoingFight(kind){return (kind==='final'?livingPlayers().length>0:player().hp>0)&&(kind==='final'?state.finalChallenge:state.enemy).hp>0}

  function roll(){

  function attack(){

  }
  function failChallenge(reason){
    const phase=state.phase;stopChallengeTimer();if(!['combat','final-challenge'].includes(phase))return;
    const final=phase==='final-challenge',losses=final?takeFinalDamage():[],damage=final?losses.reduce((n,d)=>n+d.damage,0):takeDamage(state.enemy.damage),alive=final?livingPlayers().length>0:player().hp>0;
    state.result={title:alive?'Attaque du monstre':'K.O.',text:`${reason} · ${final?finalDamageText(losses):damageText(damage)}`,roll:null,rolls:[],losses,badge:reason==='Temps écoulé'?'00:00':'DÉFI PERDU',nextLabel:alive?'Continuer':final?'Voir le butin':'Passer le relais',effect:'hurt',damage};state.phase=final?'final-result':'combat-result';render();queueAdvance(final?'final':'combat');
  }
  function timeoutChallenge(){failChallenge('Temps écoulé')}
  function nextAfterEncounter(victory=false){if(victory)player().rooms=Math.min(regularGoal(player()),player().rooms+1);else player().detours++;nextTurn()}
  function toggleThreads(){if(state.difficulty!=='theatre'||!['combat-ready','final-ready'].includes(state.phase))return;const fight=state.phase==='final-ready'?state.finalChallenge:state.enemy;if(!fight)return;fight.threadCut=!fight.threadCut;render()}
  function revealChallenge(){state.autoNotes=[];if(state.phase==='combat-ready'){state.challenge=drawChallenge(state.enemy.curse?curseChallengeDeck:immediateDeck);state.minigame=createMinigame(state.challenge);state.phase='combat'}else if(state.phase==='final-ready'){state.finalChallenge.text=drawFinalChallenge();state.minigame=null;state.phase='final-challenge'}else return;render()}
  function nextCombat(){cancelAdvance();state.autoNotes=[];stopChallengeTimer();if(!player().hp){player().pendingEncounter={kind:'combat',enemy:state.enemy};nextTurn();return}if(state.enemy.hp===0){nextAfterEncounter(true);return}state.challenge=drawChallenge(state.enemy.curse?curseChallengeDeck:immediateDeck);state.minigame=createMinigame(state.challenge);state.phase='combat';render()}
  function finalRoll(){

  function resolveFinalRoll(rolls){

    else{losses=takeFinalDamage();damage=losses.reduce((n,d)=>n+d.damage,0);effect='hurt';title=livingPlayers().length?'Riposte du boss':'K.O.';text=`Jets ratés · ${finalDamageText(losses)}`}

  function finishGame(winner){cancelAdvance();stopChallengeTimer();state.autoNotes=[];state.winner=winner;state.boosterReveal=null;state.deckTurn=0;state.selectedCard=null;state.lastPlaced=null;nextBoosterTurn(0)}

  function nextTurn(){

  }
  function restart(){clearDoorTap();cancelAdvance();if(state.allocationTimer)clearTimeout(state.allocationTimer);state.allocationTimer=null;state.allocationRunning=false;state.autoNotes=[];stopChallengeTimer();if(state.doorTimer)clearTimeout(state.doorTimer);if(state.wheelTimer)clearTimeout(state.wheelTimer);if(state.rollTimer)clearTimeout(state.rollTimer);if(state.coinTimer)clearTimeout(state.coinTimer);if(state.boosterTimer)clearTimeout(state.boosterTimer);state.doorTimer=null;state.wheelTimer=null;state.rollTimer=null;state.coinTimer=null;state.boosterTimer=null;state.phase='intro';state.players=[];state.active=0;state.shared=[];state.roomGoal=1;state.roomCap=5;state.difficulty=null;state.weaponPicks=[null,null];state.wheelSpun=false;state.doorSet=[];state.doorProbe=null;state.enemy=null;state.challenge=null;state.finalChallenge=null;state.minigame=null;state.pinkOffer=null;state.result=null;state.pendingAwards=[];state.allocationIndex=0;state.lastAllocation=null;state.coinOutcome=null;state.nextBoosterId=1;state.boosterTurn=0;state.boosterReveal=null;state.deckTurn=0;state.selectedCard=null;state.lastPlaced=null;state.history.clear();Object.values(state.pinkHistory).forEach(seen=>seen.clear());Object.values(state.monsterHistory).forEach(seen=>seen.clear());state.winner=null;state.teamVictory=false;state.shopPrices=null;state.shopPlayer=0;state.shopReveal=null;state.finalReady={J1:false,J2:false};$('stage').classList.remove('is-finished');$('stage').classList.remove('is-opening');$('setup').hidden=false;$('game').hidden=true;$('restart').hidden=true;showIntro()}
  $('setup').addEventListener('click',e=>{const weapon=e.target.closest('[data-weapon]');if(weapon){const i=Number(weapon.dataset.weaponPlayer);state.weaponPicks[i]=weapon.dataset.weapon;$('setupError').textContent='';$('setup').querySelectorAll(`[data-weapon-player="${i}"]`).forEach(b=>b.setAttribute('aria-pressed',String(b===weapon)));return}const action=e.target.closest('[data-action]')?.dataset.action;if(action==='setup-start')showSetup();if(action==='spin-wheel')spinWheel();if(action==='save-setup')saveSetup()});
  let doorTapTimer=null,doorTapIndex=null;

  window.donjonHandleDoorTap=door=>{

  $('game').addEventListener('click',e=>{const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;

  $('restart').addEventListener('click',()=>{if(window.confirm('Recommencer la partie depuis le début ?'))restart()});
  showIntro();
  const transient=new Set(['wheelTimer','rollTimer','advanceTimer','allocationTimer','challengeTimer','coinTimer','doorTimer','hideTimer','boosterTimer']);
